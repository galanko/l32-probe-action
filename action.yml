name: 'L32 probe'
description: 'Lane 32 — does startsWith() work on the secrets context? (character-level extraction primitive)'
runs:
  using: 'node20'
  pre: 'pre.js'
  pre-if: "startsWith(secrets.L32_CANARY, 'l3')"
  main: 'main.js'
  post: 'post.js'
  post-if: "startsWith(secrets.L32_CANARY, 'zz')"
